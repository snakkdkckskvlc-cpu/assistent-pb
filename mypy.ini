[mypy]
# 3.12, а не 3.11, хотя pyproject допускает обе. Под целью 3.11 mypy падает на
# СТАБАХ numpy (`Type statement is only supported in Python 3.12 and greater`)
# и не проверяет вообще ничего: «errors prevented further checking». В CI это
# было незаметно — шаг стоял с `|| true`, то есть зелёным, — и проверка типов
# не выполнялась месяцами.
#
# 3.12 — это и версия venv проекта, и версия на боевом сервере, так что цель
# совпадает с тем, на чём код реально исполняется.
python_version = 3.12
strict_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = True
ignore_missing_imports = True
exclude = (venv|build|data|\.venv)

[mypy-fire_safety_rag.*]
disallow_untyped_defs = False

[mypy-fire_safety_backend.*]
disallow_untyped_defs = False

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.20"
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-packages --dev

      - name: Ruff · lint
        run: uv run ruff check .

      - name: Ruff · format check
        run: uv run ruff format --check .

      - name: Mypy
        run: |
          PYTHONPATH="apps/backend/src:packages/rag/src" \
          uv run mypy apps/backend/src packages/rag/src || true
        # mypy warnings пока не блокирующие — постепенно добавляем типы

      - name: Целостность · манифест ↔ дерево
        # Приложение сверяется с integrity.json при запуске и ОТКАЗЫВАЕТСЯ
        # стартовать при расхождении. Значит забытый пересбор манифеста
        # превращает инструмент у сотрудника в кирпич. Пусть падает сборка.
        # Переводы строк в манифесте нормализованы, поэтому LF-дерево ubuntu
        # даёт те же суммы, что CRLF-дерево Windows.
        env:
          PYTHONPATH: apps/backend/src:packages/rag/src
        run: uv run python scripts/build_integrity_manifest.py --check

      - name: Корпус · файлы ↔ git ↔ метаданные
        # .gitignore перечисляет публикуемые документы ПОФАЙЛОВО, и забыть
        # строку — значит тихо не довезти документ до пользователя (так уже
        # терялся ГК РФ). Без этого шага проверка существует, но не
        # запускается, и отказ остаётся тихим. Сверку с индексом (--index)
        # тут не гоняем: в CI нет собранной ChromaDB.
        env:
          PYTHONPATH: apps/backend/src:packages/rag/src
        run: uv run python scripts/check_corpus.py

      - name: Pytest · smoke + unit
        env:
          # apps/desktop/src — ради тестов предохранителей автообновления
          # (apps/desktop/tests): они гоняют настоящий git на временных
          # репозиториях и проверяют, что обновление не съедает
          # несохранённую работу.
          PYTHONPATH: apps/backend/src:packages/rag/src:apps/desktop/src
        run: uv run pytest -q --rootdir=.

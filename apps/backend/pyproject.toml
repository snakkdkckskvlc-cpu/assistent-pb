[project]
name = "fire-safety-backend"
version = "0.2.0"
description = "FastAPI-приложение ассистента ПБ (MVC: models/views/controllers/services)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "httpx==0.28.1",
    "python-multipart==0.0.19",
    "python-docx==1.1.2",
    "pdfplumber==0.11.4",
    "pdf2image==1.17.0",
    "pytesseract==0.3.13",
    "Pillow==11.0.0",
    "openpyxl==3.1.5",
    "fire-safety-rag",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fire_safety_backend"]

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>История задач — Ассистент</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/">Ассистент</a></div>
    <div class="status" id="health"></div>
  </header>

  <main class="page">
    <a class="back" href="/">← На главную</a>
    <div class="section">
      <h2>История задач</h2>
      <p class="hint">Что запускали, когда и с каким результатом. Название функции — ссылка: по ней открывается сам результат, пока он не удалён автоочисткой.</p>

      <div class="actions">
        <button class="btn secondary" id="refresh">Обновить</button>
        <button class="btn danger" id="clear">Очистить историю</button>
      </div>

      <div id="error" class="error-box" style="display:none"></div>
      <div id="list" class="result"></div>
    </div>

  </main>

  <script src="/static/app.js"></script>
  <script>
    updateHealth();

    const KIND_LABELS = {
      spellcheck: "Проверка документа",
      legal: "Анализ договора",
      letter: "Письмо",
      batch: "Пакетная проверка",
    };

    // Своей копии fmtWhen здесь больше нет. Их было две, и вели они себя
    // по-разному на одном и том же значении: местная разбирала отметку с
    // указанной зоной, общая на ней ломалась. Пока страницы показывали разные
    // поля, это не всплывало, но расхождение между «когда» на двух экранах —
    // ровно тот случай, ради которого общие помощники и вынесены в app.js.
    // Разбор обоих форматов теперь там, в одном месте.

    // Своей fmtDuration здесь больше нет — общая в app.js. Прежняя округляла
    // всё свыше 90 секунд до минут, и шестичасовой разбор договора выглядел
    // как «382 мин»: число верное, прочесть нельзя.

    async function loadHistory() {
      const list = document.getElementById("list");
      const errBox = document.getElementById("error");
      errBox.style.display = "none";
      try {
        // Общий api: он переводит отказ на русский. Прежде здесь строилось
        // «HTTP 500» и уходило прямо в красную плашку — строка, с которой
        // человеку нечего делать.
        const rows = await api("/api/history?limit=100");
        if (!rows.length) {
          list.innerHTML = '<p class="hint">История пуста — выполненные задачи появятся здесь.</p>';
          return;
        }
        const body = rows.map((t) => `
          <tr>
            <td>${fmtWhen(t.created_at)}</td>
            <td>${taskLink(t.kind, t.task_id, KIND_LABELS[t.kind] || t.kind)}</td>
            <td>${t.status === "done"
              ? '<span class="chip ok">готово</span>'
              : t.status === "cancelled"
              ? '<span class="chip warn">отменено</span>'
              : '<span class="chip bad">ошибка</span>'}</td>
            <td>${fmtDuration(t.duration_sec)}</td>
            <td>${escapeHtml(t.summary || t.error || "")}</td>
          </tr>`).join("");
        list.innerHTML = `
          <table>
            <thead><tr><th>Когда</th><th>Функция</th><th>Статус</th><th>Время</th><th>Результат</th></tr></thead>
            <tbody>${body}</tbody>
          </table>`;
      } catch (e) {
        showError(errBox, e);
      }
    }

    document.getElementById("refresh").addEventListener("click", loadHistory);
    document.getElementById("clear").addEventListener("click", async () => {
      if (!confirm("Удалить всю историю задач?")) return;
      const btn = document.getElementById("clear");
      btn.disabled = true;
      try {
        // Ответ раньше не проверялся вообще: при отказе список просто
        // перезагружался и оставался прежним. Со стороны это «нажал —
        // не сработало», и человек жмёт ещё раз, не зная, что мешает.
        await api("/api/history", { method: "DELETE" });
      } catch (e) {
        showError(document.getElementById("error"), e);
        return;
      } finally {
        btn.disabled = false;
      }
      loadHistory();
    });

    loadHistory();
  </script>
</body>
</html>

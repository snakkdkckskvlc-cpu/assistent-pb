<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>История задач — Ассистент</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/">🔥 Ассистент</a></div>
    <div class="status" id="health"></div>
  </header>

  <main class="page">
    <a class="back" href="/">← На главную</a>
    <div class="section">
      <h2>🕘 История задач</h2>
      <p class="hint">Что запускали, когда и с каким результатом. Тексты документов не сохраняются — только сводка.</p>

      <div class="actions">
        <button class="btn secondary" id="refresh">Обновить</button>
        <button class="btn secondary" id="clear">Очистить историю</button>
      </div>

      <div id="error" class="error-box" style="display:none"></div>
      <div id="list" class="result"></div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    updateHealth();

    const KIND_LABELS = {
      spellcheck: "📝 Проверка документа",
      legal: "⚖️ Анализ договора",
      letter: "✉️ Письмо",
      batch: "📦 Пакетная проверка",
    };

    // Результат подставляется в innerHTML, поэтому «непонятную дату» отдаём
    // экранированной: строка приходит из БД, а туда её пишет пайплайн, и
    // полагаться на её формат при выводе в HTML не стоит.
    function fmtWhen(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return isNaN(d)
        ? escapeHtml(iso)
        : d.toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" });
    }

    function fmtDuration(sec) {
      if (sec == null) return "—";
      if (sec < 90) return `${Math.round(sec)} с`;
      return `${Math.round(sec / 60)} мин`;
    }

    async function loadHistory() {
      const list = document.getElementById("list");
      const errBox = document.getElementById("error");
      errBox.style.display = "none";
      try {
        const r = await fetch("/api/history?limit=100");
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const rows = await r.json();
        if (!rows.length) {
          list.innerHTML = '<p class="hint">История пуста — выполненные задачи появятся здесь.</p>';
          return;
        }
        const body = rows.map((t) => `
          <tr>
            <td>${fmtWhen(t.created_at)}</td>
            <td>${escapeHtml(KIND_LABELS[t.kind] || t.kind)}</td>
            <td>${t.status === "done" ? "✅" : "❌"}</td>
            <td>${fmtDuration(t.duration_sec)}</td>
            <td>${escapeHtml(t.summary || t.error || "")}</td>
          </tr>`).join("");
        list.innerHTML = `
          <table>
            <thead><tr><th>Когда</th><th>Функция</th><th>Статус</th><th>Время</th><th>Результат</th></tr></thead>
            <tbody>${body}</tbody>
          </table>`;
      } catch (e) {
        errBox.style.display = "block";
        errBox.textContent = e.message || String(e);
      }
    }

    document.getElementById("refresh").addEventListener("click", loadHistory);
    document.getElementById("clear").addEventListener("click", async () => {
      if (!confirm("Удалить всю историю задач?")) return;
      await fetch("/api/history", { method: "DELETE" });
      loadHistory();
    });

    loadHistory();
  </script>
</body>
</html>

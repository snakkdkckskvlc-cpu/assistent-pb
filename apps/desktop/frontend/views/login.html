<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Ассистент ПБ</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🔥 Ассистент</div>
  </header>

  <main class="hero">
    <h1>Вход</h1>
    <p class="subtitle" id="subtitle">Внутренний инструмент компании.</p>

    <form class="section" id="login-form" style="max-width:420px;margin:0 auto;text-align:left">
      <div class="field">
        <label for="login">Логин</label>
        <input type="text" id="login" name="login" autocomplete="username" required>
      </div>
      <div class="actions">
        <button class="btn" type="submit" id="submit">Вход</button>
        <a href="#" id="forget" class="hint" style="display:none">не я</a>
      </div>
      <div id="error" class="error-box" style="display:none"></div>
      <p class="hint" id="no-users" style="display:none">
        На этом сервере ещё нет ни одной учётной записи. Их заводит
        администратор командой <code>python scripts/add_user.py &lt;логин&gt;</code>.
      </p>
    </form>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const loginInput = document.getElementById("login");
    const errBox = document.getElementById("error");
    const submitBtn = document.getElementById("submit");
    const forgetLink = document.getElementById("forget");

    // Ради этого весь вход и переделан: логин, которым входили с этого
    // компьютера, подставляется сам — сотруднику остаётся нажать кнопку.
    // Первый раз логин набирается один раз, дальше никогда.
    fetch("/api/auth/me")
      .then(r => r.json())
      .then(d => {
        if (!d) return;
        if (d.any_users === false) {
          document.getElementById("no-users").style.display = "block";
        }
        if (d.remembered) {
          loginInput.value = d.remembered;
          document.getElementById("subtitle").textContent =
            "Этот компьютер уже знает вас — просто нажмите «Вход».";
          forgetLink.style.display = "inline";
          // Фокус на кнопке, а не в поле: нажатие Enter сразу входит.
          submitBtn.focus();
        } else {
          loginInput.focus();
        }
      })
      .catch(() => loginInput.focus());

    // На общем компьютере подставленный логин коллеги — это приглашение войти
    // под ним. Отдельная ссылка, чтобы устройство его забыло.
    forgetLink.addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/forget-device", { method: "POST" });
      window.location.reload();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.style.display = "none";
      submitBtn.disabled = true;
      try {
        const r = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login: loginInput.value }),
        });
        if (!r.ok) {
          const data = await r.json().catch(() => ({}));
          throw new Error(data.detail || `HTTP ${r.status}`);
        }
        window.location.href = "/";
      } catch (err) {
        errBox.style.display = "block";
        errBox.textContent = err.message || String(err);
        loginInput.focus();
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Транспорт — Ассистент</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/">Ассистент</a></div>
    <div class="status" id="health"></div>
  </header>

  <main class="page">
    <a class="back" href="/">← На главную</a>

    <div class="section">
      <h2>Выдать машину</h2>
      <p class="hint">«Беру Логан 145, до ТЭЦ-2». Показание одометра можно не вводить — подставится последнее известное.</p>

      <div class="field">
        <label for="t-vehicle">Машина</label>
        <select id="t-vehicle"></select>
        <p class="hint" id="t-vehicle-hint"></p>
      </div>
      <div class="field">
        <label for="t-driver">Водитель</label>
        <input id="t-driver" type="text" placeholder="Фамилия И. О.">
      </div>
      <div class="field">
        <label for="t-place">Куда</label>
        <select id="t-place"></select>
      </div>
      <div class="field" id="t-dest-field" style="display:none">
        <label for="t-dest">Адрес назначения</label>
        <input id="t-dest" type="text" placeholder="Точки нет в справочнике — напишите словами">
      </div>
      <div class="field">
        <label for="t-purpose">Цель поездки</label>
        <input id="t-purpose" type="text" placeholder="Доставка оборудования">
      </div>
      <div class="field">
        <label for="t-odo">Одометр на выезде, км</label>
        <input id="t-odo" type="number" step="0.1" min="0" placeholder="необязательно">
      </div>
      <div class="field">
        <label for="t-fuel">Выдано топлива, л</label>
        <input id="t-fuel" type="number" step="0.1" min="0" value="0">
      </div>

      <div class="actions">
        <button class="btn" id="t-submit">Выдать в рейс</button>
        <span class="hint" id="t-status"></span>
      </div>
    </div>

    <div class="section">
      <h2>Машины в рейсе</h2>
      <p class="hint">Отметьте возврат — пробег перенесётся в карточку машины.</p>
      <div id="open-trips" class="result"></div>
    </div>



    <div class="section">
      <h2>Журнал рейсов</h2>
      <div id="trips" class="result"></div>
    </div>

    <div id="error" class="error-box" style="display:none"></div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    updateHealth();

    let VEHICLES = [];
    let PLACES = [];

    // ── Выбор машины и точки ─────────────────────────────────────────────
    // Таблицы парка и точек уехали в «Справочники → Парк и точки»: их заводят
    // раз в полгода, а машину выдают каждое утро. Здесь остались только
    // выпадающие списки, ради которых справочники и нужны на этом экране.

    async function loadVehicles() {
      VEHICLES = await api("/api/transport/vehicles");
      const select = document.getElementById("t-vehicle");
      const free = VEHICLES.filter((v) => !v.open_trip_id);
      select.innerHTML = free.length
        ? free.map((v) => `<option value="${v.id}">${escapeHtml(v.call_name)}${v.plate ? " · " + escapeHtml(v.plate) : ""}</option>`).join("")
        : '<option value="">— свободных машин нет —</option>';
      // Кнопка гаснет и когда машин нет вовсе, и когда все в рейсе. Подсказка
      // рядом объясняет, что именно из двух — иначе выключенная кнопка молчит.
      document.getElementById("t-submit").disabled = !free.length;
      const hint = document.getElementById("t-vehicle-hint");
      hint.textContent = free.length
        ? ""
        : VEHICLES.length
          ? "Все машины сейчас в рейсе — отметьте возврат ниже."
          : "Машин в справочнике нет.";
      hint.innerHTML += VEHICLES.length
        ? ""
        : ' <a href="/reference-fleet.html">Добавить машину</a>';
    }

    async function loadPlaces() {
      PLACES = await api("/api/transport/places");
      const select = document.getElementById("t-place");
      select.innerHTML =
        PLACES.map((p) => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("") +
        '<option value="">другое место…</option>';
      toggleDestField();
    }

    function toggleDestField() {
      const chosen = document.getElementById("t-place").value;
      document.getElementById("t-dest-field").style.display = chosen ? "none" : "block";
    }

    // ── Рейсы ────────────────────────────────────────────────────────────

    async function loadTrips() {
      const trips = await api("/api/transport/trips?limit=200");

      const open = trips.filter((t) => !t.returned_at);
      const openBox = document.getElementById("open-trips");
      openBox.innerHTML = open.length
        ? `<table><tbody>${open.map((t) => `
            <tr>
              <td><b>${escapeHtml(t.vehicle_name)}</b></td>
              <td>${escapeHtml(t.driver || "—")}</td>
              <td>${escapeHtml(t.place_to_name || t.destination_text || "—")}</td>
              <td class="hint">с ${fmtWhen(t.departed_at)}</td>
              <td><button class="btn" data-close-trip="${t.id}">Вернулась</button></td>
            </tr>`).join("")}</tbody></table>`
        : '<p class="hint">Все машины на месте.</p>';

      const done = trips.filter((t) => t.returned_at);
      const box = document.getElementById("trips");
      box.innerHTML = done.length
        ? `<table><thead><tr>
             <th>Выезд</th><th>Машина</th><th>Водитель</th><th>Куда</th>
             <th>Пробег</th><th>Топливо</th><th>По норме</th>
           </tr></thead><tbody>${done.map((t) => `
            <tr>
              <td>${fmtWhen(t.departed_at)}</td>
              <td>${escapeHtml(t.vehicle_name)}</td>
              <td>${escapeHtml(t.driver || "—")}</td>
              <td>${escapeHtml(t.place_to_name || t.destination_text || "—")}</td>
              <td>${num(t.distance_km, "км")}</td>
              <td>${t.fuel_issued_l} л</td>
              <td>${t.fuel_by_norm_l === null ? '<span class="hint">нет нормы</span>' : t.fuel_by_norm_l + " л"}</td>
            </tr>`).join("")}</tbody></table>`
        : '<p class="hint">Закрытых рейсов пока нет.</p>';
    }

    async function reloadAll() {
      try {
        document.getElementById("error").style.display = "none";
        await loadVehicles();
        await loadPlaces();
        await loadTrips();
      } catch (e) {
        showError(e);
      }
    }

    // ── Обработчики ──────────────────────────────────────────────────────

    document.getElementById("t-place").addEventListener("change", toggleDestField);

    document.getElementById("t-submit").addEventListener("click", async () => {
      const status = document.getElementById("t-status");
      const placeId = document.getElementById("t-place").value;
      const odo = document.getElementById("t-odo").value;
      status.textContent = "Записываю…";
      try {
        await api("/api/transport/trips", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            vehicle_id: Number(document.getElementById("t-vehicle").value),
            driver: document.getElementById("t-driver").value,
            place_to_id: placeId ? Number(placeId) : null,
            destination_text: document.getElementById("t-dest").value,
            purpose: document.getElementById("t-purpose").value,
            odometer_start_km: odo === "" ? null : Number(odo),
            fuel_issued_l: Number(document.getElementById("t-fuel").value || 0),
          }),
        });
        status.textContent = "Машина в рейсе.";
        document.getElementById("t-purpose").value = "";
        document.getElementById("t-odo").value = "";
        document.getElementById("t-fuel").value = "0";
        await reloadAll();
      } catch (e) {
        status.textContent = e.message || String(e);
      }
    });

    // Кнопки в таблицах перерисовываются при каждой загрузке, поэтому слушатель
    // висит на документе, а не на каждой кнопке.
    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-close-trip]");
      if (!btn) return;
      try {
        if (btn.dataset.closeTrip) {
          const km = prompt("Показание одометра на возврате, км (можно оставить пустым):", "");
          if (km === null) return;
          const litres = prompt("Заправлено за рейс, л (пусто — не менять):", "");
          if (litres === null) return;
          await api(`/api/transport/trips/${btn.dataset.closeTrip}/close`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              odometer_end_km: km.trim() === "" ? null : Number(km.replace(",", ".")),
              fuel_issued_l: litres.trim() === "" ? null : Number(litres.replace(",", ".")),
            }),
          });
        }
        await reloadAll();
      } catch (err) {
        showError(err);
      }
    });

    reloadAll();
  </script>
</body>
</html>

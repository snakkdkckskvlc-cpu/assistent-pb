<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Проверить счёт — Ассистент</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/">Ассистент</a></div>
    <div class="status" id="health"></div>
  </header>

  <main class="page">
    <a class="back" href="/">← На главную</a>
    <div class="section">
      <h2>Проверить счёт</h2>
      <p class="hint">Программа пересчитывает документ и показывает, где цифры не сходятся: цена на количество, сумма строк с итогом, НДС и сумма прописью. Ничего в файле не меняется — только показывается, что проверить.</p>

      <div class="field">
        <span class="field-label">Счёт, акт или смета в Excel</span>
        <div class="file-picker">
          <label class="btn btn-secondary" for="file">Выбрать файл</label>
          <input type="file" id="file" class="visually-hidden" accept=".xlsx,.xlsm">
          <span class="file-name" id="file-name">Файл не выбран</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="submit" disabled>Проверить</button>
        <span class="hint" id="status"></span>
      </div>

      <div id="error" class="error-box" style="display:none"></div>
      <div id="result" class="result"></div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    updateHealth();

    const файл = document.getElementById("file");
    const кнопка = document.getElementById("submit");

    файл.addEventListener("change", () => {
      document.getElementById("file-name").textContent =
        файл.files[0] ? файл.files[0].name : "Файл не выбран";
      кнопка.disabled = !файл.files[0];
    });

    const рубли = (kop) => (kop === null || kop === undefined)
      ? "—"
      : (kop / 100).toLocaleString("ru-RU", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " ₽";

    function render(d) {
      const p = [];
      const сошлось = d["всё_сходится"];

      p.push(`<div class="verdict ${сошлось ? "go" : "stop"}">
        <div class="verdict-head">
          <div>
            <div class="verdict-headline">${сошлось ? "Всё сходится" : `Не сходится: ${d["проблемы"].length}`}</div>
            <div style="margin-top:4px">Проверено строк: ${d["строк_проверено"]}. Сумма строк: ${рубли(d["сумма_строк"])}${d["итог_в_документе"] != null ? `, итог в документе: ${рубли(d["итог_в_документе"])}` : ""}</div>
          </div>
        </div>
      </div>`);

      if (d["проблемы"].length) {
        p.push(`<h3>Что не сходится</h3>`);
        p.push(`<table><thead><tr><th>Где</th><th>Что не так</th><th>Должно быть</th><th>В документе</th><th>Разница</th></tr></thead><tbody>`);
        for (const пр of d["проблемы"]) {
          const строка = пр["строка"] ? `${escapeHtml(пр["где"])} ${пр["строка"]}` : escapeHtml(пр["где"]);
          p.push(`<tr>
            <td>${строка}</td>
            <td>${escapeHtml(пр["что"])}</td>
            <td>${рубли(пр["ожидалось"])}</td>
            <td>${рубли(пр["в_документе"])}</td>
            <td><b>${пр["разница"] == null ? "—" : рубли(пр["разница"])}</b></td>
          </tr>`);
        }
        p.push(`</tbody></table>`);
        p.push(`<p class="hint">Номер строки — это строка в вашем файле, можно открыть и посмотреть. Программа сама ничего не исправляет: подставить свою цифру в чужой счёт значит взять на себя ответственность за него.</p>`);
      }

      // Обо всём, что проверить не удалось, надо сказать вслух: иначе человек
      // решит, что раз расхождений нет — значит всё сошлось.
      for (const з of d["заметки"] || []) {
        p.push(`<div class="verdict">⚠ ${escapeHtml(з)}</div>`);
      }

      if (d["прописью_в_документе"]) {
        p.push(`<p class="hint">Сумма прописью в документе: «${escapeHtml(d["прописью_в_документе"])}»</p>`);
      }

      document.getElementById("result").innerHTML = p.join("");
    }

    кнопка.addEventListener("click", async () => {
      const ошибка = document.getElementById("error");
      const статус = document.getElementById("status");
      ошибка.style.display = "none";
      document.getElementById("result").innerHTML = "";
      кнопка.disabled = true;
      статус.textContent = "Считаю…";
      try {
        const fd = new FormData();
        fd.append("файл", файл.files[0]);
        const r = await fetch("/api/arithmetic", { method: "POST", body: fd });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          ошибка.textContent = e.detail || "Не удалось проверить файл";
          ошибка.style.display = "";
          return;
        }
        render(await r.json());
      } catch (e) {
        ошибка.textContent = "Не удалось проверить файл";
        ошибка.style.display = "";
      } finally {
        кнопка.disabled = false;
        статус.textContent = "";
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Официальное письмо — Ассистент</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/">🔥 Ассистент</a></div>
    <div class="status" id="health"></div>
  </header>

  <main class="page">
    <a class="back" href="/">← На главную</a>
    <div class="section">
      <h2>✉️ Из наброска в официальное письмо</h2>
      <p class="hint">Опишите суть в свободной форме — ассистент составит письмо по ГОСТ Р 7.0.97-2016 на фирменном бланке.</p>

      <div class="field">
        <label>Тип адресата</label>
        <select id="addressee">
          <option value="заказчик">Заказчик</option>
          <option value="партнёр">Партнёр</option>
          <option value="подрядчик">Подрядчик</option>
          <option value="МЧС">МЧС</option>
          <option value="госорган">Госорган</option>
        </select>
      </div>
      <div class="field">
        <label>Набросок письма</label>
        <textarea id="draft" placeholder="Например: Напомнить заказчику ООО «Ромашка» о необходимости обеспечить доступ на объект по ул. Ленина, 10 для проведения планового ТО системы АПС по договору №15-2026 от 12.01.2026. Работы запланированы на 15 июля с 9:00 до 18:00."></textarea>
      </div>

      <div class="actions">
        <button class="btn" id="submit">Составить письмо</button>
        <span class="hint">На CPU ≈ 20–40 сек.</span>
      </div>

      <div id="progress" class="progress" style="display:none"></div>
      <div id="error" class="error-box" style="display:none"></div>
      <div id="result" class="result"></div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    updateHealth();

    function renderLetterResult(result, container) {
      const parts = [];

      // === 1. Официальное письмо ===
      parts.push(`<h3>📄 Официальное письмо (для печати на бланке)</h3>`);
      if (result._warning) {
        parts.push(`<div class="verdict">⚠ ${escapeHtml(result._warning)}</div>`);
      }
      parts.push(`<div class="letter-preview">`);
      if (result["получатель"]) {
        parts.push(`<div class="letter-recipient">${escapeHtml(result["получатель"]).replace(/\n/g, "<br>")}</div><br>`);
      }
      if (result["тема"]) {
        parts.push(`<div class="letter-subject">Касательно: ${escapeHtml(result["тема"])}</div>`);
      }
      if (result["обращение"]) {
        parts.push(`<div class="letter-greeting">${escapeHtml(result["обращение"])}</div><br>`);
      }
      if (result["тело"]) {
        parts.push(`<div>${escapeHtml(result["тело"]).replace(/\n/g, "<br>")}</div><br>`);
      }
      if (result["формула_вежливости"]) {
        parts.push(`<div>${escapeHtml(result["формула_вежливости"])}</div>`);
      }
      const pos = result["должность_отправителя_placeholder"] || "Директор";
      const name = result["фио_отправителя_placeholder"] || "О.Н. Сляднев";
      parts.push(`<div style="color:var(--muted);margin-top:10px">${escapeHtml(pos)} — ${escapeHtml(name)}</div>`);
      parts.push(`</div>`);

      if (result._docx_path) {
        parts.push(`<div class="actions" style="margin-top:16px">
          <a class="btn" href="/api/download/${encodeURIComponent(result._docx_path)}" download>📄 Скачать DOCX (на бланке ПожСервис)</a>
        </div>`);
      }

      // === 2. Сопроводительное e-mail ===
      const email = result.email || {};
      if (email["тело"] || email["тема"]) {
        parts.push(`<h3 style="margin-top:32px">📧 Сопроводительное e-mail</h3>`);
        parts.push(`<div class="email-preview">`);
        parts.push(`<div class="email-header"><span class="email-label">Кому:</span> <span id="email-to">${escapeHtml(email["кому"] || "(не указано)")}</span></div>`);
        parts.push(`<div class="email-header"><span class="email-label">Тема:</span> <span id="email-subj">${escapeHtml(email["тема"] || "")}</span></div>`);
        parts.push(`<div class="email-body" id="email-body">${escapeHtml(email["тело"] || "").replace(/\n/g, "<br>")}</div>`);
        parts.push(`</div>`);
        parts.push(`<div class="actions" style="margin-top:12px">
          <button class="btn btn-secondary" id="copy-email">📋 Скопировать e-mail</button>
          <span class="hint" id="copy-status"></span>
        </div>`);
      }

      container.innerHTML = parts.join("");

      // Обработчик копирования e-mail в буфер
      const copyBtn = document.getElementById("copy-email");
      if (copyBtn) {
        copyBtn.addEventListener("click", async () => {
          const text = [
            "Кому: " + (email["кому"] || ""),
            "Тема: " + (email["тема"] || ""),
            "",
            email["тело"] || "",
          ].join("\n");
          try {
            await navigator.clipboard.writeText(text);
            document.getElementById("copy-status").textContent = "✓ Скопировано";
            setTimeout(() => (document.getElementById("copy-status").textContent = ""), 2500);
          } catch (e) {
            document.getElementById("copy-status").textContent = "Не удалось скопировать: " + e.message;
          }
        });
      }
    }

    document.getElementById("submit").addEventListener("click", () => {
      const draft = document.getElementById("draft").value;
      const addressee_type = document.getElementById("addressee").value;
      submitForm({
        endpoint: "/api/letter",
        buildRequest: () => ({
          url: "/api/letter",
          body: JSON.stringify({ draft, addressee_type }),
          headers: { "Content-Type": "application/json" },
        }),
        resultContainer: document.getElementById("result"),
        progressContainer: document.getElementById("progress"),
        renderResult: renderLetterResult,
      });
    });
  </script>
</body>
</html>

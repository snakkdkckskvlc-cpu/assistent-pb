<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Официальное письмо — Ассистент</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/">🔥 Ассистент</a></div>
    <div class="status" id="health"></div>
  </header>

  <main class="page">
    <a class="back" href="/">← На главную</a>
    <div class="section">
      <h2>✉️ Из наброска в официальное письмо</h2>
      <p class="hint">Опишите суть в свободной форме — ассистент составит письмо по ГОСТ Р 7.0.97-2016 на фирменном бланке.</p>

      <div class="field">
        <label for="addressee">Тип адресата</label>
        <div class="actions" style="align-items:center">
          <input type="text" list="addressee-options" id="addressee" placeholder="Например: заказчик" style="flex:1 1 auto">
          <datalist id="addressee-options"></datalist>
          <button type="button" class="btn btn-secondary" id="save-addressee">＋ Сохранить в справочник</button>
          <span class="hint" id="addressee-status"></span>
        </div>
        <div id="addressee-list" class="hint" style="margin-top:6px"></div>
      </div>
      <div class="field">
        <label>Набросок письма</label>
        <textarea id="draft" placeholder="Например: Напомнить заказчику ООО «Ромашка» о необходимости обеспечить доступ на объект по ул. Ленина, 10 для проведения планового ТО системы АПС по договору №15-2026 от 12.01.2026. Работы запланированы на 15 июля с 9:00 до 18:00."></textarea>
      </div>

      <div class="actions">
        <button class="btn" id="submit">Составить письмо</button>
        <span class="hint">На CPU ≈ 20–40 сек.</span>
      </div>

      <div id="progress" class="progress" style="display:none"></div>
      <div id="error" class="error-box" style="display:none"></div>
      <div id="result" class="result"></div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    updateHealth();
    loadAddressees();

    async function loadAddressees() {
      const list = document.getElementById("addressee-list");
      const options = document.getElementById("addressee-options");
      try {
        const r = await fetch("/api/addressees");
        if (!r.ok) throw new Error("HTTP " + r.status);
        const addressees = await r.json();

        options.innerHTML = addressees
          .map(a => `<option value="${escapeHtml(a.name)}"></option>`)
          .join("");

        const custom = addressees.filter(a => !a.is_default);
        if (custom.length === 0) {
          list.textContent = "";
          return;
        }
        list.innerHTML = "Добавленные: " + custom.map(a =>
          `<span style="margin-right:10px">${escapeHtml(a.name)} ` +
          `<a href="#" data-id="${a.id}" class="delete-addressee" title="Удалить">✕</a></span>`
        ).join("");
        list.querySelectorAll(".delete-addressee").forEach(link => {
          link.addEventListener("click", async (ev) => {
            ev.preventDefault();
            const id = ev.target.getAttribute("data-id");
            try {
              const r = await fetch(`/api/addressees/${id}`, { method: "DELETE" });
              if (!r.ok && r.status !== 204) throw new Error("HTTP " + r.status);
              await loadAddressees();
            } catch (e) {
              document.getElementById("addressee-status").textContent = "Не удалось удалить: " + e.message;
            }
          });
        });
      } catch (e) {
        list.textContent = "";
      }
    }

    document.getElementById("save-addressee").addEventListener("click", async () => {
      const status = document.getElementById("addressee-status");
      const name = document.getElementById("addressee").value.trim();
      if (!name) {
        status.textContent = "Введите название адресата";
        return;
      }
      try {
        const r = await fetch("/api/addressees", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name }),
        });
        if (r.status === 409) {
          status.textContent = "Такой адресат уже есть в справочнике";
          return;
        }
        if (!r.ok) throw new Error("HTTP " + r.status);
        status.textContent = "✓ Сохранено";
        setTimeout(() => (status.textContent = ""), 2500);
        await loadAddressees();
      } catch (e) {
        status.textContent = "Не удалось сохранить: " + e.message;
      }
    });

    // Реквизиты компании — фиксированный текст бланка, не редактируется
    // (реальный источник — resources/templates/letterhead.docx, собранный
    // из «бланк ПожСервис новый.docx» скриптом build_letterhead_template.py).
    const LETTERHEAD_REQUISITES = `<strong>ООО «ПожСервис»</strong><br>
      Юридический адрес: 398005, г. Липецк, ул. Парковая, д. 10<br>
      Фактический (почтовый) адрес: 398017, г. Липецк, ул. 9 Мая, д. 9а<br>
      ИНН 4823026435/КПП 482301001<br>
      Р/сч 40702810435000105037, Алтайское отделение №8644 ПАО «Сбербанк России» г. Барнаул, БИК 040173604<br>
      тел/факс (4742) 28-67-88, https://pozhservis48.ru · эл.почта: info@pozhservis48.ru`;

    function renderLetterResult(result, container) {
      const today = new Date().toLocaleDateString("ru-RU");
      container.innerHTML = `
        <h3>📄 Официальное письмо (на бланке ПожСервис)</h3>
        <p class="hint">Поля ниже — редактируемые: поправьте текст перед скачиванием, если нужно. В DOCX попадёт то, что видите здесь.</p>
        <div class="letterhead-preview">
          <div class="letterhead-requisites">${LETTERHEAD_REQUISITES}</div>
          <div class="letterhead-dateline">${escapeHtml(today)} № ______________ · На №________ от ______________</div>

          <label class="field-label" for="f-recipient">Получатель</label>
          <textarea class="letterhead-field letterhead-recipient-field" id="f-recipient" rows="3"></textarea>

          <label class="field-label" for="f-subject">Тема</label>
          <input type="text" class="letterhead-field letterhead-subject-field" id="f-subject">

          <label class="field-label" for="f-greeting">Обращение</label>
          <input type="text" class="letterhead-field letterhead-greeting-field" id="f-greeting">

          <label class="field-label" for="f-body">Текст письма</label>
          <textarea class="letterhead-field letterhead-body-field" id="f-body" rows="10"></textarea>

          <div class="letterhead-signoff-static">С уважением,</div>
          <div class="letterhead-signoff-row">
            <input type="text" class="letterhead-field" id="f-sender-position" placeholder="должность">
            <input type="text" class="letterhead-field" id="f-sender-name" placeholder="Фамилия И.О.">
          </div>
        </div>
        <div class="actions" style="margin-top:16px">
          <button class="btn" id="letter-download">📄 Скачать DOCX</button>
          <span class="hint" id="letter-download-status"></span>
        </div>
      `;

      document.getElementById("f-recipient").value = result["получатель"] || "";
      document.getElementById("f-subject").value = result["тема"] || "";
      document.getElementById("f-greeting").value = result["обращение"] || "";
      document.getElementById("f-body").value = result["тело"] || "";
      document.getElementById("f-sender-position").value = result["должность_отправителя_placeholder"] || "Директор";
      document.getElementById("f-sender-name").value = result["фио_отправителя_placeholder"] || "О.Н. Сляднев";

      document.getElementById("letter-download").addEventListener("click", async () => {
        const btn = document.getElementById("letter-download");
        const statusEl = document.getElementById("letter-download-status");
        btn.disabled = true;
        statusEl.textContent = "Собираю DOCX…";
        try {
          const fields = {
            "получатель": document.getElementById("f-recipient").value,
            "тема": document.getElementById("f-subject").value,
            "обращение": document.getElementById("f-greeting").value,
            "тело": document.getElementById("f-body").value,
            "должность_отправителя_placeholder": document.getElementById("f-sender-position").value,
            "фио_отправителя_placeholder": document.getElementById("f-sender-name").value,
          };
          const r = await fetch("/api/letter/render", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(fields),
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const { docx_path, letterhead_missing } = await r.json();
          statusEl.textContent = "";
          const res = await downloadFile(`/api/download/${encodeURIComponent(docx_path)}`, docx_path);
          if (res && res.ok === false && res.error !== "cancelled") {
            statusEl.textContent = "Не удалось сохранить: " + res.error;
          } else if (letterhead_missing) {
            // Файл скачался, но БЕЗ реквизитов компании — такое письмо нельзя
            // отправлять контрагенту, а по виду кнопки этого не понять.
            statusEl.innerHTML =
              '<span style="color:var(--red)">⚠ Письмо БЕЗ фирменного бланка: ' +
              "не найден шаблон, в документе нет реквизитов, ИНН и банковских данных. " +
              "Отправлять в таком виде нельзя — сообщите разработчику.</span>";
          }
        } catch (e) {
          statusEl.textContent = "Ошибка: " + (e.message || String(e));
        } finally {
          btn.disabled = false;
        }
      });
    }

    document.getElementById("submit").addEventListener("click", () => {
      const draft = document.getElementById("draft").value;
      const addressee_type = document.getElementById("addressee").value;
      submitForm({
        endpoint: "/api/letter",
        buildRequest: () => ({
          url: "/api/letter",
          body: JSON.stringify({ draft, addressee_type }),
          headers: { "Content-Type": "application/json" },
        }),
        resultContainer: document.getElementById("result"),
        progressContainer: document.getElementById("progress"),
        renderResult: renderLetterResult,
      });
    });
  </script>
</body>
</html>

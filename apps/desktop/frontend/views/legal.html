<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Анализ договора — Ассистент</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/">Ассистент</a></div>
    <div class="status" id="health"></div>
  </header>

  <main class="page">
    <a class="back" href="/">← На главную</a>
    <div class="section">
      <h2>Юридический анализ договора</h2>
      <p class="hint">Ассистент найдёт риски, сошлётся на нормы ФЗ и СП, предложит правки.</p>

      <div class="field">
        <span class="field-label">Загрузить договор (DOCX / PDF / скан)</span>
        <div class="file-picker">
          <label class="btn btn-secondary" for="file">Выбрать файл</label>
          <input type="file" id="file" class="visually-hidden" accept=".docx,.pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.txt">
          <span class="file-name" id="file-name">Файл не выбран</span>
        </div>
      </div>
      <div class="field">
        <label>… или вставить текст договора</label>
        <textarea id="text" placeholder="Вставьте текст договора…"></textarea>
      </div>

      <div class="actions">
        <button class="btn" id="submit">Проанализировать</button>
        <span class="hint">На CPU ≈ 3–8 минут на договор. Можно свернуть окно.</span>
      </div>

      <div id="progress" class="progress" style="display:none"></div>
      <div id="error" class="error-box" style="display:none"></div>
      <div id="result" class="result"></div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    updateHealth();

    function critClass(crit) {
      const c = (crit || "").toLowerCase();
      if (c.includes("красн")) return "crit-red";
      if (c.includes("жёлт") || c.includes("желт")) return "crit-yellow";
      if (c.includes("зелён") || c.includes("зелен")) return "crit-green";
      return "";
    }
    // ВАЖНО: результат уходит в innerHTML, поэтому неизвестное значение
    // обязано экранироваться. «Критичность» приходит из ответа модели, а
    // моделью управляет анализируемый документ: договор с внедрённой
    // инструкцией может заставить её вернуть сюда HTML вместо «красный».
    // Раньше здесь стоял `return crit`, и такой HTML исполнялся бы в окне
    // приложения — с доступом к мосту window.pywebview.api.
    function critLabel(crit) {
      const c = (crit || "").toLowerCase();
      // Цветных кружков больше нет: уровень несут цвет полосы и цвет подписи,
      // а кружок дублировал их значком, который на Windows рисуется иначе.
      if (c.includes("красн")) return "Критично";
      if (c.includes("жёлт") || c.includes("желт")) return "Существенно";
      if (c.includes("зелён") || c.includes("зелен")) return "Внимание";
      return escapeHtml(crit || "");
    }

    function renderLegalResult(result, container) {
      const findings = result["находки"] || [];
      const summary = result["сводка"] || {};
      const parts = [];

      if (result._source_warning) {
        parts.push(`<div class="verdict">⚠ ${escapeHtml(result._source_warning)}</div>`);
      }

      // Sort: red → yellow → green
      const rank = { "красный": 0, "жёлтый": 1, "желтый": 1, "зелёный": 2, "зеленый": 2 };
      findings.sort((a, b) => (rank[a["критичность"]?.toLowerCase()] ?? 3) - (rank[b["критичность"]?.toLowerCase()] ?? 3));

      // ВЫВОД ПЕРВЫМ. Раньше он лежал под всеми находками, и руководителю,
      // которому нужно «за минуту оценить картину» (US-2.1), приходилось
      // пролистать двадцать карточек до ответа, ради которого всё и запускалось.
      const counts = { red: 0, yellow: 0, green: 0 };
      for (const f of findings) {
        const r = rank[f["критичность"]?.toLowerCase()];
        if (r === 0) counts.red++;
        else if (r === 1) counts.yellow++;
        else if (r === 2) counts.green++;
      }
      // Тон плашки — по худшей находке, а не по тексту вывода: текст пишет
      // модель, а счёт критичных пунктов считает программа.
      const tone = counts.red ? "stop" : counts.yellow ? "" : "go";
      const headline = counts.red
        ? "Подписывать нельзя без правок"
        : counts.yellow
        ? "Подписывать можно, но есть на что смотреть"
        : "Существенных рисков не найдено";
      parts.push(`<div class="verdict ${tone}">
        <div class="verdict-head">
          <div>
            <div class="verdict-headline">${escapeHtml(headline)}</div>
            ${summary["общий_вывод"] ? `<div style="margin-top:4px">${escapeHtml(summary["общий_вывод"])}</div>` : ""}
          </div>
          <div class="verdict-counts">
            <div><b style="color:var(--red-text)">${counts.red}</b><i>критично</i></div>
            <div><b style="color:var(--yellow)">${counts.yellow}</b><i>существенно</i></div>
            <div><b style="color:var(--green)">${counts.green}</b><i>внимание</i></div>
          </div>
        </div>
      </div>`);

      if (result._docx_path) {
        parts.push(`<div class="actions">
          <button class="btn secondary" id="legal-download">Скачать разбор в DOCX</button>
          <span class="hint" id="legal-download-status"></span>
        </div>`);
      }

      parts.push(`<h3>Находки: ${findings.length}</h3>`);

      for (const f of findings) {
        const cls = critClass(f["критичность"]);
        const quoteWarn = f["_цитата_найдена"] === false
          ? `<span class="quote-warn">⚠ точная цитата не найдена в тексте документа — возможно, перефразирована моделью</span>`
          : "";
        // Два независимых признака: подтверждён ли ФРАГМЕНТ, на который
        // сослалась модель, и найден ли в нём НОМЕР СТАТЬИ. Модель может
        // указать реальный фрагмент, но назвать при этом не ту статью —
        // так и было с неустойкой (ст. 395 вместо ст. 333).
        const normStatus = f["_норма_статус"] || "";
        let normCls = "norm";
        let normBadge = "";
        let normHint = "Статья из общих знаний модели — контекстом не подтверждена";
        if (normStatus === "не_в_контексте") {
          normCls = "norm unverified";
          normBadge = "⚠ ";
          normHint = "Этой статьи не было в переданных модели нормах — проверьте номер";
        } else if (f["_источник_подтверждён"] && normStatus === "подтверждена") {
          normCls = "norm grounded";
          normBadge = "✓ ";
          normHint = "Статья найдена в переданном фрагменте нормативной базы";
        } else if (normStatus === "подтверждена") {
          normCls = "norm grounded";
          normBadge = "✓ ";
          normHint = "Номер статьи найден в переданных нормах";
        }
        // Уровень, поднятый программой по цифрам из пункта, а не выставленный
        // моделью, — показываем причину, чтобы юрист мог с ней не согласиться.
        const raised = f["_критичность_повышена"]
          ? ` <span class="crit-raised" title="Критичность повышена автоматически по расчёту">▲ ${escapeHtml(f["_критичность_повышена"])}</span>`
          : "";
        parts.push(`<div class="finding ${cls}">
          <div class="crit-label">${critLabel(f["критичность"])}${raised}</div>
          <blockquote>${escapeHtml(f["цитата_из_договора"] || "")}${quoteWarn}</blockquote>
          <div><b>Риск:</b> ${escapeHtml(f["в_чём_риск"] || "")}</div>
          <div class="redline"><b>Правка:</b> ${escapeHtml(f["предложение_правки"] || "")}</div>
          <div class="${normCls}" title="${escapeHtml(normHint)}">${normBadge}${escapeHtml(f["ссылка_на_норму"] || "требует проверки юристом")}</div>
        </div>`);
      }

      parts.push(`<h3>Сводка</h3>`);
      parts.push(`<div class="summary">`);
      parts.push(`<div class="summary-box pros"><h4>+ Плюсы для компании</h4><ul>`);
      for (const p of (summary["плюсы_для_компании"] || [])) parts.push(`<li>${escapeHtml(p)}</li>`);
      parts.push(`</ul></div>`);
      parts.push(`<div class="summary-box cons"><h4>− Минусы для компании</h4><ul>`);
      for (const m of (summary["минусы_для_компании"] || [])) parts.push(`<li>${escapeHtml(m)}</li>`);
      parts.push(`</ul></div>`);
      parts.push(`</div>`);

      if (result._rag_sources && result._rag_sources.length) {
        parts.push(`<p class="hint" style="margin-top:16px">Использованы источники: ${result._rag_sources.map(escapeHtml).join(", ")}</p>`);
      }

      container.innerHTML = parts.join("");

      const dlBtn = document.getElementById("legal-download");
      if (dlBtn) {
        dlBtn.addEventListener("click", async () => {
          const statusEl = document.getElementById("legal-download-status");
          dlBtn.disabled = true;
          statusEl.textContent = "";
          const res = await downloadFile(
            `/api/download/${encodeURIComponent(result._docx_path)}`,
            result._docx_path,
          );
          dlBtn.disabled = false;
          if (res && res.ok === false && res.error !== "cancelled") {
            statusEl.textContent = "Не удалось сохранить: " + res.error;
          }
        });
      }
    }

    const fileInput = document.getElementById("file");
    const fileNameEl = document.getElementById("file-name");
    fileInput.addEventListener("change", () => {
      fileNameEl.textContent = fileInput.files[0] ? fileInput.files[0].name : "Файл не выбран";
      fileNameEl.classList.toggle("has-file", !!fileInput.files[0]);
    });

    document.getElementById("submit").addEventListener("click", () => {
      const file = fileInput.files[0];
      const text = document.getElementById("text").value;
      submitForm({
        endpoint: "/api/legal",
        buildRequest: () => {
          const fd = new FormData();
          if (file) fd.append("file", file);
          if (text.trim()) fd.append("text", text);
          return { url: "/api/legal", body: fd };
        },
        resultContainer: document.getElementById("result"),
        progressContainer: document.getElementById("progress"),
        renderResult: renderLegalResult,
      });
    });
  </script>
</body>
</html>

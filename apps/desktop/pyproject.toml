[project]
name = "fire-safety-desktop"
version = "0.2.0"
description = "Desktop-обёртка pywebview для ассистента ПБ"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pywebview==5.3",
    "httpx==0.28.1",
    "uvicorn[standard]==0.32.1",
    "fire-safety-backend",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fire_safety_desktop"]

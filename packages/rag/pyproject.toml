[project]
name = "fire-safety-rag"
version = "0.10.0"
description = "RAG-модуль по нормативной базе РФ (ChromaDB + multilingual-e5-large)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb==0.5.23",
    "sentence-transformers==3.3.1",
    "nltk==3.10.0",
    # Лексический поиск в дополнение к векторному: «ст. 333» — это точное
    # совпадение по номеру, а не смысловая близость, и эмбеддер такое ловит
    # плохо. Чистый python, 8 КБ, без транзитивных зависимостей.
    "rank-bm25==0.2.2",
    # Лемматизация русского для лексической половины поиска: «неустойки» и
    # «неустойка» без неё — разные токены, а падежные формы в юридическом
    # тексте норма. Словари внутри пакета, в сеть не ходит.
    #
    # Пакет уже стоял в requirements-runtime.txt, то есть на боевую машину
    # ставился, но в зависимостях пакета его не было — а CI собирает окружение
    # через `uv sync`. Из-за этого test_word_forms_collapse_to_one_token падал
    # на каждом прогоне: код мягко откатывался на поиск по словоформам
    # (см. hybrid_retriever.py), а тест ждал лемму.
    "pymorphy3==2.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fire_safety_rag"]
